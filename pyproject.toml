[project]
name = "teabot-wom"
version = "1.1.0"
description = "Wise Old Man for teabot: Discord members link their game accounts, which group into people, follow renames, and give labels that role rules match."
readme = "README.md"
license = "MIT"
authors = [{ name = "teabot-dev" }]
requires-python = ">=3.12"
dependencies = ["teabot>=1.12,<2"]

[project.urls]
Source = "https://github.com/teabot-dev/teabot-wom"

[project.entry-points."teabot.plugins"]
wom = "teabot_wom:plugin"

[dependency-groups]
dev = ["teabot[testing]", "pyright>=1.1.414", "ruff>=0.17"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teabot_wom"]

[tool.pytest.ini_options]
addopts = "-p teabot.testing.fixtures"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120

[tool.pyright]
typeCheckingMode = "strict"
